[project]
name = "tiangong-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gj0908722", email = "120444790@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-redis>=0.5.2",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "neo4j>=6.4.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymilvus>=3.0.2",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
