services:
  # ==================== PostgreSQL（已停用：改用线上实例）====================
  # 本地不再启动 postgres，DATABASE 连接请指向线上地址（见 .env）
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: tiangong-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: tiangong
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # ==================== Redis Stack（支持 JSON + RediSearch）====================
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: tiangong-redis
    restart: unless-stopped
    ports:
      - "6379:6379"      # Redis
      - "8001:8001"      # RedisInsight
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== MinIO（对象存储）====================
  # 官方 minio/minio 已从 Docker Hub 下架（拉取返回 denied），改用社区兼容 fork
  # pgsty/silo 基于 MinIO 代码构建，S3 API / env 变量 / healthcheck 端点均一致
  minio:
    image: pgsty/silo:latest
    container_name: tiangong-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== etcd（Milvus 依赖）====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: tiangong-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Milvus ====================
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: tiangong-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"    # Milvus
      - "9091:9091"      # Metrics
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==================== Attu（Milvus 可视化）====================
  attu:
    image: zilliz/attu:v2.4
    container_name: tiangong-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus

  # ==================== Neo4j ====================
  neo4j:
    image: neo4j:5.20-community
    container_name: tiangong-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/medical123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"      # Browser
      - "7687:7687"      # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  # postgres_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  neo4j_data:
  neo4j_logs: